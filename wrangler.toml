name = "doseping"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Static frontend (public/) is served by Cloudflare; /api/* goes to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "doseping-db"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations"

[vars]
# PBKDF2 iterations. 100000 is fine on the Workers Paid plan.
# If logins fail with CPU-limit errors on the Free plan, lower this (e.g. 30000).
PBKDF2_ITERATIONS = "100000"

[triggers]
# Daily housekeeping: purge expired sessions / old login attempts (03:00 UTC)
crons = ["0 3 * * *"]
